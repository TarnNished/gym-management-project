# In-memory H2 database - nothing to install. Data resets on restart.
spring.datasource.url=jdbc:h2:mem:gym;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Browse the DB at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:gym, user: sa)
spring.h2.console.enabled=true
