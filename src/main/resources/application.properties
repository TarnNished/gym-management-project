spring.application.name=gym-management

# Default profile: h2 (in-memory DB, no setup needed). Use --spring.profiles.active=dev for PostgreSQL.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Secret comes from the JWT_SECRET environment variable (min. 32 chars).
# If it is not set, a random secret is generated at startup (tokens then stop working after a restart).
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=36000000

# File upload: files are physically stored in this folder, their file name is saved in users.photo_path
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Demo data (training types, trainees, trainers, trainings) loaded on startup when the DB is empty
app.seed.enabled=true
app.seed.file=classpath:data.json

# Largest page size a client may request
spring.data.web.pageable.max-page-size=100

spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
